<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pre-Enrollment Selection</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
      text-align: center;
      width: 350px;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 1s ease forwards;
    }

    .logo img {
      width: 100px;
      margin-bottom: 1rem;
      animation: bounceIn 1.2s ease;
    }

    .infos {
      margin-bottom: 2rem;
      font-size: 1rem;
      color: #333;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 0.6s;
    }

    .btn {
      display: block;
      width: 92%;
      padding: 0.75rem;
      margin: 0.5rem 0;
      font-size: 1rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      color: #fff;
      transition: transform 0.2s ease, background 0.3s;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.8s ease forwards;
    }

    .btn:nth-of-type(1) {
      animation-delay: 0.8s;
    }

    .btn:nth-of-type(2) {
      animation-delay: 1s;
    }

    .btn.old {
      background: #007bff;
    }

    .btn.old:hover {
      background: #0056b3;
      transform: scale(1.05);
    }

    .btn.new {
      background: #28a745;
    }

    .btn.new:hover {
      background: #1e7e34;
      transform: scale(1.05);
    }

    /* Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes bounceIn {
      0% {
        opacity: 0;
        transform: scale(0.3);
      }

      50% {
        opacity: 1;
        transform: scale(1.1);
      }

      70% {
        transform: scale(0.9);
      }

      100% {
        transform: scale(1);
      }
    }

    .back-arrow {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 40px;
      height: 40px;
      color: #000000;
      font-size: 50px;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      animation: fadeInLeft 0.8s ease forwards;
      opacity: 0;
    }

    @keyframes fadeInLeft {
      from {
        opacity: 0;
        transform: translateX(-30px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
  </style>
</head>

<body>
  <a href="/" class="back-arrow">&#8592;</a>
  <div class="container">
    <div class="logo">
      <img src="/public/asset/Logo_of_UTYCC.png" alt="School Logo">
    </div>
    <div class="infos">
      <p>Please select your enrollment type below:</p>
    </div>
    <a href="pre_enrollment" class="btn new">New Student (for the first year)</a>
    <a href="pre_enrollment_old" class="btn old">Old Student (for the rest of the year)</a>
  </div>
</body>

</html>
