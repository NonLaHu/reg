<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Error | UTYCC Registration System</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .error-container {
            max-width: 600px;
            text-align: center;
            padding: 40px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .logo {
            width: 80px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 10px;
            color: #c0392b;
        }
        p {
            margin: 10px 0;
            font-size: 1rem;
        }
        .status {
            font-size: 1.1rem;
            font-weight: bold;
            color: #555;
            margin-bottom: 20px;
        }
        .btn-home {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #3498db;
            color: #fff;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.3s ease;
        }
        .btn-home:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <!-- Replace with your actual logo -->
        <img th:src="@{/public/asset/Logo_of_UTYCC.png}" alt="UTYCC Logo" class="logo">

        <h1>Something went wrong</h1>
        <p class="status">Error: <span th:text="${status}"></span></p>
        <p th:text="${message}">An unexpected error occurred. Please try again later.</p>
        <a href="/" class="btn-home">Go Back Home</a>
    </div>
</body>
</html>
