<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrollment Closed</title>

    <style>
        body {
            background-color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            margin-top: 50px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .logo-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 40px;
        }

        .logo-wrapper img {
            width: 150px;
            border-radius: 12px;
            border: 5px solid #ddd;
        }

        h4,
        h6,
        p {
            margin: 10px 0;
        }

        .closed-message {
            margin-top: 50px;
            font-size: 22px;
            color: #d9534f; /* Red color to indicate closure */
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo-wrapper">
            <img src="/public/asset/Logo_of_UTYCC.png" alt="UTYCC Logo">
        </div>

        <h4>နည်းပညာတက္ကသိုလ်(ရတနာပုံဆိုက်ဘာစီးတီး)</h4>
        <h6>(၂၀၂၅-၂၀၂၆) ပညာသင်နှစ်</h6>
        <p>ကျောင်းသားအဖြစ် မှတ်ပုံတင်ခွင့်တောင်းခံခြင်း</p>

        <div class="closed-message">
            The enrollment is currently closed.<br>
            မှတ်ပုံတင်ခွင့်တောင်းခံခြင်း ကိုရပ်ဆိုင်းထားပါသည်။
        </div>

    </div>

</body>

</html>
