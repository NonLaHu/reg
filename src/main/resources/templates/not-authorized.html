<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Not Authorized</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-600: #2563eb;
            --accent: hwb(189 2% 17%);
            --bg: #f5f5f9;
            --bg_second: #f5f5f9;
            --card: #13398a;
            --card_second: #13398a;
            --glass: rgba(255, 255, 255, 0.06);
            --muted: #cbd5e1;
            --text: #e6eef8;
            --subtle: rgba(230, 238, 248, 0.06);
            --success: #10b981;
            --danger: #ef4444;
            --shadow: 0 8px 30px rgba(2, 6, 23, 0.6);
            --radius: 12px;
            --gap: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: var(--text);
            text-align: center;
            overflow: hidden;
        }

        .container {
            max-width: 600px;
            padding: 20px;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            animation: fadeIn 1.5s ease-in-out;
        }

        h1 {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: shake 0.5s;
            color: var(--primary);
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: var(--text);
        }

        button {
            padding: 12px 25px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            background: var(--text);
            color: var(--primary);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: var(--primary-600);
            color: var(--text);
        }

        @keyframes shake {
            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            50% {
                transform: translateX(5px);
            }

            75% {
                transform: translateX(-5px);
            }

            100% {
                transform: translateX(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>403</h1>
        <p>You are not authorized to access this page.</p>
        <p>Your Jwt Could have been expired</p>
        <button id="backBtn">Home</button>
        <button id="backLogin">Login</button>
    </div>

    <script>
        const backBtn = document.getElementById('backBtn');
        backBtn.addEventListener('click', () => {
            window.location.href = '/';
        });
        const backLogin = document.getElementById('backLogin');
        backLogin.addEventListener('click', () => {
            window.location.href = '/login';
        });
    </script>
</body>

</html>
