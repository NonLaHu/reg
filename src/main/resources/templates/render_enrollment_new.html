<!DOCTYPE html>
<html>
<head>
  <title>Enrollment Detail</title>
</head>
<body>

  <script>
  (function() {
    const content = sessionStorage.getItem("pageContentEnrollmentNewStudent");

    if (content) {
      // Inject the HTML content
      document.open();
      document.write(content);
      document.close();

      // Array of external script URLs needed by the injected content
      const scriptsToLoad = [
        "/public/js/newStudentForm.js",
        "/public/js/store_db.js"
      ];

      // Load each script sequentially
      scriptsToLoad.forEach(src => {
        const script = document.createElement("script");
        script.src = src;
        script.async = false; // keep execution order
        document.body.appendChild(script);
      });

    } else {
      document.body.innerHTML = "<p>No content found</p>";
    }
  })();
  </script>

</body>
</html>
