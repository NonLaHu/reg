logging.level.org.hibernate.SQL=${LOGGING_LEVEL_SQL:INFO}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOGGING_LEVEL_BINDER:WARN}

# Max file size for uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=51MB

# Upload directory
file.upload-dir=${FILE_UPLOAD_DIR:uploads}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

jwt.secret=${JWT_SECRET:11c2cddd64eefafaf5171e670ad7c804a2537f69f290c48ccc88b2b9f8d4ef8c}
jwt.expirationDate=${JWT_EXPIRATION:86400000}

logging.file.name=${LOGGING_FILE_NAME:logs/app.log}

logging.level.root=INFO
logging.level.org.springframework.web=ERROR

logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.max-history=10

spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:false}
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

admin.upload-dir=${ADMIN_UPLOAD_DIR:uploads/payment}
