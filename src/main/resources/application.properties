spring.application.name=reg
server.address=0.0.0.0
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/student_reg}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:student_reg}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:utycc2025}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

backup.mysql.user=${BACKUP_MYSQL_USER:student_reg}
backup.mysql.password=${BACKUP_MYSQL_PASSWORD:utycc2025}
backup.mysql.database=${BACKUP_MYSQL_DATABASE:student_reg}
